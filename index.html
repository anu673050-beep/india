
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country Explorer</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    background: linear-gradient(
        135deg,
        #ff9933,
        #ffffff,
        #138808
    );
}

.container {
    width: 100%;
    max-width: 580px;
    background: #fffaf7;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.15);
}

h1 {
    font-size: 28px;
    color: #222;
    margin-bottom: 10px;
}

.subtitle {
    color: #777;
    font-size: 14px;
    margin-bottom: 25px;
}

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #138808;
}

button {
    background: #2878d0;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #155da8;
}

.result {
    display: none;
    background: white;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #eee;
}

.flag {
    width: 100%;
    height: 180px;
    object-fit: contain;
    padding: 8px;
}

.country-name {
    font-size: 21px;
    color: #222;
    padding: 10px;
    font-weight: bold;
}

.details {
    padding: 10px 20px 20px;
    text-align: left;
}

.info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 5px;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}

.info:last-child {
    border-bottom: none;
}

.info span:last-child {
    font-weight: bold;
    color: #333;
    text-align: right;
}

#message {
    color: #d32f2f;
    margin-top: 15px;
    font-size: 14px;
}

@media(max-width: 450px) {
    .container {
        padding: 20px 14px;
    }

    h1 {
        font-size: 24px;
    }

    .flag {
        height: 140px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>Country Explorer</h1>

    <p class="subtitle">
        Search for any country to see its details
    </p>

    <div class="search-box">
        <input
            type="text"
            id="countryInput"
            placeholder="Enter country name..."
        >

        <button onclick="searchCountry()">🔍</button>
    </div>

    <div class="result" id="result">

        <img id="flag" class="flag" src="" alt="Country Flag">

        <div class="country-name" id="countryName"></div>

        <div class="details">

            <div class="info">
                <span>Capital</span>
                <span id="capital"></span>
            </div>

            <div class="info">
                <span>Region</span>
                <span id="region"></span>
            </div>

            <div class="info">
                <span>Population</span>
                <span id="population"></span>
            </div>

            <div class="info">
                <span>Currency</span>
                <span id="currency"></span>
            </div>

        </div>
    </div>

    <p id="message"></p>

</div>

<script>

async function searchCountry() {

    const country = document
        .getElementById("countryInput")
        .value.trim();

    const result = document.getElementById("result");
    const message = document.getElementById("message");

    if (country === "") {
        result.style.display = "none";
        message.innerText = "Please enter a country name!";
        return;
    }

    result.style.display = "none";
    message.innerText = "Loading...";

    try {

        const response = await fetch(
            `https://restcountries.com/v3.1/name/${encodeURIComponent(country)}`
        );

        if (!response.ok) {
            throw new Error("Country not found");
        }

        const data = await response.json();
        const c = data[0];

        document.getElementById("flag").src = c.flags.png;

        document.getElementById("countryName").innerText =
            c.name.common;

        document.getElementById("capital").innerText =
            c.capital ? c.capital.join(", ") : "N/A";

        document.getElementById("region").innerText =
            c.region || "N/A";

        document.getElementById("population").innerText =
            c.population.toLocaleString("en-IN");

        let currency = "N/A";

        if (c.currencies) {
            currency = Object.values(c.currencies)
                .map(item => item.name + " (" + (item.symbol || "") + ")")
                .join(", ");
        }

        document.getElementById("currency").innerText = currency;

        result.style.display = "block";
        message.innerText = "";

    } catch (error) {

        result.style.display = "none";
        message.innerText =
            "Country not found! Please try again.";

    }
}

document.getElementById("countryInput")
.addEventListener("keypress", function(event) {

    if (event.key === "Enter") {
        searchCountry();
    }

});

</script>

</body>
</html>
